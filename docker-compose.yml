services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Not published to the host — only reachable by other containers on
    # this compose network. The app talks to it via DATABASE_URL below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # Bound to localhost only — Nginx on the host handles public 80/443
      # and reverse-proxies here. Don't expose 3000 publicly directly.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly pg_dump into ./backups on the host, kept 14 days. Point this at
  # off-box storage (S3, etc.) too if you want real disaster recovery.
  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: postgres
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        while true; do
          FILE=/backups/$$(date +%Y-%m-%d_%H%M%S).sql.gz;
          echo \"[backup] dumping to $$FILE\";
          pg_dump -h $$PGHOST -U $$POSTGRES_USER -d $$POSTGRES_DB | gzip > $$FILE;
          find /backups -name '*.sql.gz' -mtime +14 -delete;
          sleep 86400;
        done
      "

volumes:
  pgdata:
