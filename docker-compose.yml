services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Not published to the host — only reachable by other containers on
    # this compose network. The app talks to it via DATABASE_URL below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      # Passed through to the Dockerfile's builder stage as --build-arg —
      # these are NEXT_PUBLIC_* vars, inlined into the client bundle by
      # `next build`, so env_file below (runtime-only) can't reach them.
      # docker-compose resolves ${...} here from the compose-level .env
      # file next to this docker-compose.yml (same file POSTGRES_USER
      # above comes from) — set them there, not just in .env.production.
      args:
        NEXT_PUBLIC_FEATURE_MEETINGS: ${NEXT_PUBLIC_FEATURE_MEETINGS:-false}
        NEXT_PUBLIC_FEATURE_PAYROLL: ${NEXT_PUBLIC_FEATURE_PAYROLL:-false}
        NEXT_PUBLIC_FEATURE_ADMIN_TICKET: ${NEXT_PUBLIC_FEATURE_ADMIN_TICKET:-false}
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # Bound to localhost only — Nginx on the host handles public 80/443
      # and reverse-proxies here. Don't expose 3000 publicly directly.
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Nightly pg_dump into ./backups on the host, kept 14 days. Point this at
  # off-box storage (S3, etc.) too if you want real disaster recovery.

volumes:
  pgdata:
