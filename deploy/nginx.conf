# /etc/nginx/sites-available/meghasales — reverse proxy to the app container.
# After copying this in, run: sudo ln -s /etc/nginx/sites-available/meghasales /etc/nginx/sites-enabled/
# then `sudo certbot --nginx -d your-domain.com` to fill in the SSL block automatically.

server {
    listen 80;
    server_name your-domain.com;

    # NextAuth's session cookie carries the user's full permission list (161
    # names for ADMIN) and comes back on every request — the default 8k
    # header limit is too tight.
    large_client_header_buffers 4 32k;

    # certbot will add its own location block here for ACME challenges,
    # and rewrite this server block to redirect to https once SSL is issued.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # File uploads (expenses/tickets/lead documents) can be sizable.
        client_max_body_size 15M;

        # The login response sets that same large cookie; with the default
        # 4-8k proxy buffer Nginx returns 502 "upstream sent too big header".
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
